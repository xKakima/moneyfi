name: Database keepalive

# Runs daily at 00:00 PHT (16:00 UTC). Set SUPABASE_URL and SUPABASE_ANON_KEY in repository Actions secrets.
on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Configure the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi

          SUPABASE_URL="${SUPABASE_URL%/}"
          curl --fail-with-body --silent --show-error \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/rpc/ping_database"
